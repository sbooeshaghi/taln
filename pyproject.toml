[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "taln"
version = "0.1.0"
description = "Text alignment for contiguous and non-contiguous spans"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["alignment", "text mining", "tokenization", "information extraction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Text Processing :: Linguistic",
]

authors = [
  { name = "Sina Booeshaghi", email = "sinab@berkeley.edu" },
]
maintainers = [
  { name = "Sina Booeshaghi", email = "sinab@berkeley.edu" },
]

dependencies = [
    "tiktoken",
    "unidecode",
    "numpy",
]

[project.optional-dependencies]
extract = [
    "anthropic>=0.30.0",
    "python-dotenv>=1.0.0",
    "json-repair>=0.30.0",
]
dev = [
    "ruff",
    "pytest",
    "anthropic>=0.30.0",
    "python-dotenv>=1.0.0",
    "json-repair>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/sbooeshaghi/taln"
Repository = "https://github.com/sbooeshaghi/taln"
Issues = "https://github.com/sbooeshaghi/taln/issues"

[project.scripts]
taln = "taln.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["taln", "taln.*"]
exclude = ["tests", "tests.*"]

[tool.ruff]
extend-exclude = [
    "analysis",
    "data",
    "docs/submissions",
    "tests/archive",
    "tests/papers",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E203"]
