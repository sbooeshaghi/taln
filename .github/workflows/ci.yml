name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check taln tests

      - name: Compile Python files
        run: python -m py_compile taln/*.py tests/test_aln.py

      - name: Run tests
        run: pytest tests -q
